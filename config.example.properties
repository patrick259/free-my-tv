# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks.
hide_animation=false

# true leaves horror out of the picks (TMDB's Horror genre, and shows whose keywords say horror or slasher).
hide_horror=false

# true leaves animated series out of the picks (cartoons and anime shows); animated movies stay.
hide_animated_shows=false

# true puts big games in the hero (ESPN, no key), most important first: Formula 1, then the postseason (World Series,
# NFL playoffs, college bowls), Monday Night Football and college games between two ranked teams.
show_sports=true

# Your teams, ESPN's full names, comma-separated: their games come first on the Scores page (college teams even when
# unranked). Example: Boston Red Sox, New England Patriots, Oregon Ducks
favorite_teams=

# auto (follows the TV), or a language in app/assets/i18n (en, pt, es, de, ru, fr, ja, zh-CN…)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
# (a currency Binance has no pairs in, like INR, shows the prices in dollars)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# false: the remote's app buttons are left to the TV (they then work from its home screen only), and Free My TV never
# filters the remote's keys. For TVs where the filter gets in the way (a TCL on Android 12: held keys don't repeat,
# Home reads as a long press).
remote_buttons=true

# Streaming services to leave out of the picks even when their app is on the TV, comma separated (on Google TV):
# netflix, prime, disney, hulu, paramount, peacock, globoplay, max, appletv, hotstar, okko, crunchyroll, oneplay.
# For apps the TV ships that you don't subscribe to (Prime Video on a Sony, say).
hide_services=

# LG and Samsung: apps to leave out of the shelf, All Apps and the picks, comma separated, by id or name (part of it,
# any case). For apps the TV ships that can't be uninstalled, like Samsung's built-in Netflix: hide_apps=netflix
hide_apps=

# Optional: a free Watchmode key (watchmode.com) makes the picks open the title's own page in its app (Prime Video,
# JioHotstar...), not just the app. Without it, they open the app. Keep it private.
watchmode_key=

# Optional: a free Ticketmaster key (developer.ticketmaster.com) puts the big concerts, games and shows nearby on the
# music screen. Keep it private.
ticketmaster_key=

# Optional: music suggestions (weather, holidays, the season, your favorites) from Spotify, played on the TV or on a
# speaker group. Make an app at developer.spotify.com with the redirect URI http://127.0.0.1:8888/callback, put its
# Client ID here, then run: python3 tools/spotify-login.py (it adds spotify_refresh_token; keep that private).
spotify_client_id=
# The speaker or group "Everywhere" means (an Alexa group shows in Spotify under its own name).
spotify_everywhere=Everywhere
# The genre to lean the mood playlists toward ("country": a country rainy-day mix as well as a plain one). Empty: let
# Spotify say, from your top artists (new apps often get no genres from Spotify).
spotify_genre=

# Optional: Home Assistant, for the smart home controls. Its address, and a long-lived access token (in Home
# Assistant: your profile > Security > Long-lived access tokens > Create token). Keep the token private.
ha_url=
ha_token=
# The cameras to show (Home > Cameras), in order: Home Assistant camera ids, comma separated. For cameras in more than
# one place, name each place and separate them with ";" (Cameras then asks which):
# ha_cameras=Home: camera.front_door, camera.backyard; Office: camera.lobby, camera.mail_room
ha_cameras=
# false leaves the camera pictures out of the drawer (the Cameras button stays).
camera_row=true

# false leaves Live TV and the HDMI inputs out of the row under the shelf (only All Apps stays): for a TV used for apps.
show_inputs=true
